{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h1 class="mb-4 text-center">Formulario de Ropa</h1>

      <form method="post" enctype="multipart/form-data" class="p-4 border rounded shadow-sm bg-light  text-center">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="text-center">
          <button type="submit" class="btn btn-success">Guardar</button>
          <a href="{% url 'ropa_list' %}" class="btn btn-secondary ms-2">
            <i class="bi bi-arrow-left-circle"></i> Volver
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
