<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ropa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
        }
        nav a {
            color: white;
            margin-right: 1rem;
            text-decoration: none;
        }
        main {
            padding: 2rem;
        }
        .section {
            margin-bottom: 2rem;
        }
        .card {
            border: 1px solid #ccc;
            padding: 1rem;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'cliente_list' %}">Clientes</a>
            <a href="{% url 'ropa_list' %}">Ropa</a>
        </nav>
    </header>

    <h1>{% if form.instance.id %}Editar{% else %}Crear{% endif %} Ropa</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.id %}Actualizar{% else %}Crear{% endif %}</button>
    </form>

    <a href="{% url 'ropa_list' %}">Volver a la lista de ropa</a>
</body>
</html>
